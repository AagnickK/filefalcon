<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 350px; margin: 0; padding: 0; background: #f9fafb; color: #333; }
    .header { background: #2563eb; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .controls { padding: 10px 15px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .search-box { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; font-size: 13px; margin-top: 10px; }
    .toggle-container { display: flex; align-items: center; font-size: 13px; }
    .toggle-container input { margin-right: 8px; }
    .list-container { max-height: 300px; overflow-y: auto; padding: 10px 15px; }
    .empty-state { text-align: center; color: #6b7280; font-size: 13px; padding: 20px 0; }
    .pdf-item { background: #fff; border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .pdf-info { margin-bottom: 8px; }
    .pdf-name { font-weight: 600; font-size: 13px; word-break: break-all; margin-bottom: 2px; }
    .pdf-meta { font-size: 11px; color: #6b7280; display: flex; justify-content: space-between; }
    .btn-group { display: flex; gap: 8px; }
    button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: 500; flex: 1; transition: background 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .footer { padding: 15px; background: #fff; border-top: 1px solid #e5e7eb; }
    .btn-full { width: 100%; padding: 10px; font-size: 14px; background: #10b981; color: white; }
    .btn-full:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="header">
    <h2>PDF Detector</h2>
    <span class="badge" id="count-badge">0 Found</span>
  </div>
  
  <div class="controls">
    <label class="toggle-container">
      <input type="checkbox" id="auto-download-toggle">
      Auto-download new PDFs
    </label>
    <input type="text" id="filter-input" class="search-box" placeholder="Filter by name or domain...">
  </div>

  <div class="list-container" id="pdf-list">
    </div>

  <div class="footer">
    <button id="download-all-btn" class="btn-full" disabled>Download All PDFs</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
